<header class="hdr" data-header>
  <div class="hdr__in">
    <a class="hdr__logo" href="/" aria-label="Biashara Trading Company Limited, home">
      <img src="/assets/img/logo/biashara-logo-96.png" srcset="/assets/img/logo/biashara-logo-96.png 96w, /assets/img/logo/biashara-logo-192.png 192w" sizes="40px" width="96" height="125" alt="">
    </a>
    <p class="hdr__runhead label" data-runhead aria-hidden="true">{{page.partLabel}}</p>
    <nav class="hdr__nav" aria-label="Main">
      <ul role="list"><!--NAV--></ul>
    </nav>
    <div class="hdr__tools">
      <button class="hdr__index" type="button" data-index-open aria-haspopup="dialog" aria-controls="index">
        <span class="hdr__index-sq" aria-hidden="true"></span><span>Index</span>
      </button>
      <a class="btn btn--sm hdr__apply" href="/apply/" data-cursor="apply" data-magnetic>Apply now</a>
    </div>
  </div>
  <div class="hdr__progress" aria-hidden="true"><span data-progress></span></div>
</header>
