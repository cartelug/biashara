<header class="site-header" data-header>
  <div class="container site-header__in">
    <a class="brand" href="/">
      <img src="/assets/img/logo/biashara-logo-96.png" srcset="/assets/img/logo/biashara-logo-96.png 96w, /assets/img/logo/biashara-logo-192.png 192w" sizes="34px" width="96" height="125" alt="">
      <span class="brand__wordmark">Biashara <span>Trading Company Limited</span></span><span class="sr-only">, home</span>
    </a>
    <nav class="primary-nav" aria-label="Main">
      <ul role="list"><!--NAV--></ul>
    </nav>
    <div class="site-header__tools">
      <a class="header-phone" href="tel:{{contact.phone1}}"><x-icon name="phone"></x-icon><span class="tnum">{{contact.phone1Text}}</span></a>
      <a class="btn btn--sm" href="/apply/">Apply now</a>
      <button class="menu-btn needs-js" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="menu" data-menu-toggle>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-menu" data-menu-icon/></svg><span data-menu-label>Menu</span>
      </button>
    </div>
  </div>
  <div class="menu" id="menu" data-menu hidden>
    <svg class="menu__thread" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path pathLength="1" d="M1040 -40C700 200 600 300 500 480S200 800 -40 1040"/></svg>
    <div class="container menu__in">
      <p class="menu__intro"><span>Menu</span><span class="open-now needs-js" data-open-now data-compact><span class="open-now__sq" aria-hidden="true"></span><span data-open-now-text>Checking office hours</span></span></p>
      <nav aria-label="Menu">
        <p class="menu__h"><a href="/loans/">Loans<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-right"/></svg></a></p>
        <ul class="mloans" role="list"><!--MENULOANS--></ul>
        <ul class="mrows" role="list"><!--MENUMAIN--></ul>
      </nav>
      <nav aria-label="More pages" class="menu__more">
        <ul class="mchips" role="list"><!--MENU--></ul>
      </nav>
      <div class="menu__cta">
        <a class="btn btn--lg btn--block" href="/apply/">Apply now<x-icon name="arrow-right"></x-icon></a>
        <div class="menu__contact">
          <a class="menu__pill" href="tel:{{contact.phone1}}"><x-icon name="phone"></x-icon>Call</a>
          <a class="menu__pill" href="https://wa.me/{{contact.whatsapp}}" rel="noopener" target="_blank"><x-icon name="chat"></x-icon>WhatsApp<span class="sr-only"> (opens in a new tab)</span></a>
        </div>
        <p class="menu__addr">Conrad Plaza, Entebbe Road, Kampala · <span class="tnum">{{contact.phone1Text}}</span></p>
      </div>
    </div>
  </div>
</header>
