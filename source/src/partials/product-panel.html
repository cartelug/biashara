<article class="ppanel ppanel--{{p.slug}}" id="product-{{p.slug}}" aria-labelledby="pp-{{p.slug}}-t" data-hpanel>
  <span class="ppanel__ghost" aria-hidden="true">{{p.n}}</span>
  <div class="ppanel__body">
    <p class="ppanel__n label accent"><x-icon name="{{p.icon}}"></x-icon>Product {{p.n}} of 04</p>
    <h3 class="ppanel__t" id="pp-{{p.slug}}-t">{{p.name}}</h3>
    <p class="ppanel__d">{{p.desc}}</p>
    <dl class="ledger ledger--panel">
      <div><dt>Typical purpose</dt><dd>{{p.purpose}}</dd></div>
      <div><dt>Security</dt><dd>{{p.security}}</dd></div>
      <div><dt>Amount</dt><dd class="tnum">UGX&nbsp;1M&nbsp;–&nbsp;50M</dd></div>
      <div><dt>Term</dt><dd class="tnum">≤&nbsp;6 months</dd></div>
      <div><dt>Interest</dt><dd class="tnum">2.8% per month</dd></div>
    </dl>
    <div class="ppanel__cta">
      <a class="btn" href="/apply/?product={{p.slug}}" data-cursor="apply">Apply for this product<x-icon name="arrow-right"></x-icon></a>
      <a class="link-arrow" href="https://wa.me/{{contact.whatsapp}}?text=Hello%20Biashara%2C%20I%20would%20like%20to%20ask%20about%20{{p.nameUrl}}." rel="noopener" target="_blank"><x-icon name="chat"></x-icon>Ask on WhatsApp<span class="sr-only"> about {{p.name}} (opens in a new tab)</span></a>
    </div>
  </div>
  <!-- @include product-fig-{{p.slug}} -->
</article>
