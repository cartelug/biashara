<label class="pchoice">
  <input type="radio" name="product" value="{{p.slug}}" required>
  <span class="pchoice__box">
    <span class="pchoice__n label tnum">{{p.n}}</span>
    <x-tile name="{{p.icon}}"></x-tile>
    <span class="pchoice__t">{{p.name}}</span>
    <span class="pchoice__d">{{p.purpose}}</span>
    <span class="pchoice__mark" aria-hidden="true"></span>
  </span>
</label>
